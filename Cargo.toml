[package]
name = "vigie"
version = "0.2.0"
edition = "2021"
description = "Page d'état d'un routeur NixOS"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Un panic arrête le service : systemd le relance (Restart=always) au lieu de laisser un démon à moitié mort
panic = "abort"
strip = true
