[package]
name = "vigie"
version = "0.2.0"
edition = "2021"
description = "Status page for a NixOS router"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# A panic stops the service: systemd restarts it (Restart=always) instead of leaving a half-dead daemon
panic = "abort"
strip = true
