<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigie</title>
<style>
  :root {
    --bg:#e9ecec; --surface:#fff; --text:#141d1c; --muted:#54605e; --line:rgba(20,29,28,.1);
    --accent:#1f6f6a; --series2:#6b7fd6; --ok:#2e9d5b; --warn:#c98a00; --crit:#d1343b; --fire:#d9822b;
    --glass:rgba(255,255,255,.68); --edge:rgba(255,255,255,.85); --hi:rgba(255,255,255,.95);
    --sheen:linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,0) 38%);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0d1414; --surface:#162020; --text:#e8f0ee; --muted:#9fb0ad; --line:rgba(255,255,255,.09);
    --accent:#5cc2b8; --series2:#9aa8ff; --ok:#5fd08a; --warn:#f0b84a; --crit:#ff6b6b; --fire:#f0a34a;
    --glass:rgba(24,36,36,.6); --edge:rgba(255,255,255,.1); --hi:rgba(255,255,255,.14);
    --sheen:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0) 38%);
  } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  small, .muted { color:var(--muted); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  #q { flex:0 1 300px; min-width:120px; font:inherit; padding:6px 10px; border-radius:9px; border:1px solid var(--edge); color:var(--text); background:color-mix(in srgb, var(--surface) 60%, transparent); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 8px; }
  .chips button { font:inherit; font-size:12.5px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--text); cursor:pointer; }
  .chips button[aria-pressed=true], .chips button[aria-selected=true] { font-weight:650; border-color:var(--accent); background:color-mix(in srgb, var(--accent) 22%, transparent); }
  th button { font:inherit; text-transform:inherit; letter-spacing:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  th[aria-sort=ascending] button::after { content:" ▲"; } th[aria-sort=descending] button::after { content:" ▼"; }
  li.plus { justify-content:center; } .plus button { font:inherit; font-size:12.5px; color:var(--accent); background:none; border:0; padding:2px 0; cursor:pointer; }
  .plus:not(li) { text-align:center; margin-top:4px; }
  .num, td.num, th.num { font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .mono { font:12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* Background: three blurred halos drifting behind the glass */
  .halos { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .halos i { position:absolute; width:55vmax; height:55vmax; border-radius:50%; filter:blur(80px); will-change:transform; }
  .halos i:nth-child(1) { top:-22vmax; left:-14vmax; background:var(--accent); opacity:.29; animation:drift1 48s ease-in-out infinite alternate; }
  .halos i:nth-child(2) { top:8vh; right:-22vmax; background:var(--fire); opacity:.19; animation:drift2 62s ease-in-out infinite alternate; }
  .halos i:nth-child(3) { bottom:-26vmax; left:22vw; background:color-mix(in srgb, var(--accent) 55%, #6f9cff); opacity:.23; animation:drift3 55s ease-in-out infinite alternate; }
  @media (prefers-color-scheme: dark) { .halos i:nth-child(1) { opacity:.2; } .halos i:nth-child(2) { opacity:.12; } .halos i:nth-child(3) { opacity:.16; } }
  @keyframes drift1 { to { transform:translate(26vw, 20vh) scale(1.2); } }
  @keyframes drift2 { to { transform:translate(-30vw, 26vh) scale(.85); } }
  @keyframes drift3 { to { transform:translate(-24vw, -22vh) scale(1.15); } }

  /* A: sticky header */
  header { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:8px 20px; flex-wrap:wrap; padding:10px max(16px, calc((100vw - 1760px) / 2 + 16px));
    background:color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%); }
  h1 { margin:0; font-size:22px; font-weight:700; letter-spacing:-.035em; line-height:1; }
  #sys { flex:1; min-width:0; margin:0; font-size:12.5px; color:var(--muted); }
  .beacon { --c:var(--muted); display:flex; align-items:center; gap:10px; text-align:right; margin-left:auto; }
  .beacon.calm { --c:var(--ok); } .beacon.warn { --c:var(--warn); } .beacon.crit { --c:var(--crit); }
  .beacon strong { display:block; font-size:14px; font-weight:600; }
  .beacon small { display:block; font-size:12px; }
  .beacon i { position:relative; order:2; width:14px; height:14px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 34% 30%, #fff 0 10%, color-mix(in srgb, var(--c) 55%, #fff) 24%, var(--c) 62%, color-mix(in srgb, var(--c) 65%, #000) 100%);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 20%, transparent); }
  .beacon.warn i, .beacon.crit i { box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent), 0 0 16px var(--c); }
  .beacon.warn i::after, .beacon.crit i::after { content:""; position:absolute; inset:0; border-radius:50%; background:var(--c); animation:halo 2.4s ease-out infinite; }
  @keyframes halo { from { transform:scale(1); opacity:.6; } to { transform:scale(3.2); opacity:0; } }

  /* 12-column grid: phone first, then laptop, then wide */
  .page { max-width:1760px; margin:0 auto; padding:8px 16px 24px; }
  .grid { display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); gap:16px; }
  .grid > * { grid-column:span 12; min-width:0; scroll-margin-top:64px; }
  .grid > .tile { grid-column:span 6; }
  @media (min-width:700px) { .grid > .tile { grid-column:span 4; } }
  @media (min-width:1100px) {
    .traffic { grid-column:span 8 !important; } .alerts { grid-column:span 4 !important; }
    .dns1, .dns2 { grid-column:span 6 !important; }
  }
  @media (max-width:1099px) { .m { display:none; } }
  @media (min-width:1400px) {
    .grid > .tile { grid-column:span 2; }
    .traffic, .alerts { height:316px; }
    .devices { grid-column:span 8 !important; } .side { grid-column:span 4 !important; }
    .dns1, .dns2, .dns3 { grid-column:span 4 !important; }
  }

  .pan, .tile { position:relative; background:var(--sheen), var(--glass); border:1px solid var(--edge); border-radius:14px; padding:14px 16px;
    backdrop-filter:blur(26px) saturate(170%); -webkit-backdrop-filter:blur(26px) saturate(170%);
    box-shadow:inset 0 1px 0 var(--hi), 0 1px 2px rgba(20,40,38,.06), 0 18px 36px -22px rgba(20,40,38,.38); }
  .pan > h3 { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:0 0 6px; font-size:15px; font-weight:650; letter-spacing:-.015em; }
  .pan > h3 span, h4 span { font-size:12.5px; font-weight:450; letter-spacing:0; color:var(--muted); text-align:right; }
  .pan > p { margin:0 0 6px; font-size:12.5px; color:var(--muted); }
  h4 { margin:12px 0 2px; font-size:13px; font-weight:650; display:flex; justify-content:space-between; gap:8px; }

  /* B: key figures */
  .tile { height:112px; padding:12px 14px; overflow:hidden; }
  .tile h2 { margin:0; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .tile b { display:block; margin-top:2px; font-size:30px; font-weight:620; letter-spacing:-.035em; line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tile b small, .num small { font-size:.45em; font-weight:500; letter-spacing:0; margin-left:3px; color:var(--muted); }
  .tile p { margin:0; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .mini { position:absolute; right:12px; bottom:10px; width:36%; height:28px; }
  .tile.rx b::before, .tile.tx b::before { content:""; display:inline-block; width:8px; height:8px; margin-right:8px; border-radius:50%; background:var(--accent); vertical-align:middle; }
  .tile.tx b::before { background:var(--series2); }

  /* C: traffic and "to watch" */
  .traffic { display:flex; flex-direction:column; min-height:240px; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:4px 12px; flex-wrap:wrap; margin-bottom:8px; }
  .per { display:inline-flex; gap:2px; padding:2px; border-radius:9px; background:var(--line); }
  .per button { font:inherit; font-size:12.5px; padding:2px 10px; border:0; border-radius:7px; background:none; color:var(--muted); cursor:pointer; }
  .per button[aria-pressed=true] { background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.18); }
  .leg { font-size:12.5px; color:var(--muted); }
  .leg i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin:0 5px 0 12px; }
  .leg i.b { background:var(--series2); }
  .chart { position:relative; flex:1; min-height:120px; touch-action:pan-y; cursor:crosshair; }
  .chart svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  #gridlines { fill:none; stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; }
  #line-rx { fill:none; stroke:var(--accent); stroke-width:2; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  #line-tx { fill:none; stroke:var(--series2); stroke-width:1.5; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  #bars .br { fill:var(--accent); } #bars .bt { fill:var(--series2); }
  #ys span { position:absolute; left:0; transform:translateY(-50%); padding:0 4px 0 0; font-size:11.5px; color:var(--muted); pointer-events:none; }
  #guide { position:absolute; top:0; bottom:0; width:1px; background:var(--muted); opacity:.6; pointer-events:none; }
  #tip { position:absolute; top:2px; z-index:2; padding:4px 8px; border-radius:8px; font-size:12px; line-height:1.35; white-space:nowrap; pointer-events:none;
    background:var(--surface); border:1px solid var(--line); box-shadow:0 6px 16px -6px rgba(0,0,0,.35); }
  .xs { display:flex; justify-content:space-between; margin-top:3px; font-size:11.5px; color:var(--muted); }
  .mini svg { display:block; width:100%; height:100%; overflow:visible; }
  .mini path { fill:none; stroke:var(--c, var(--accent)); stroke-width:1.5; vector-effect:non-scaling-stroke; stroke-linejoin:round; }
  .mini rect { fill:var(--c, var(--accent)); opacity:.75; }
  .m2 p { max-width:60%; } #k-tx { --c:var(--series2); }
  #totals { margin:4px 0 0; font-size:12.5px; color:var(--muted); }
  .alerts { display:flex; flex-direction:column; }
  .alerts ul { overflow-y:auto; flex:1; min-height:0; margin-top:0; }
  .alert { align-items:center; justify-content:flex-start; }
  .lvl { flex:none; min-width:64px; padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:650; text-align:center; border:1px solid currentColor; }
  .n0 .lvl { color:var(--crit); } .n1 .lvl { color:var(--warn); } .n2 .lvl { color:var(--muted); }
  .health { display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:12.5px; }
  .indicator { display:flex; align-items:center; gap:6px; } .indicator span { color:var(--muted); }
  .pt { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; margin-right:6px; }
  .pt.ok { background:var(--ok); box-shadow:0 0 6px color-mix(in srgb, var(--ok) 50%, transparent); }
  .pt.att { background:var(--warn); } .pt.ko { background:var(--crit); box-shadow:0 0 6px color-mix(in srgb, var(--crit) 55%, transparent); }
  .indicator .pt { margin:0; }

  ul { list-style:none; margin:4px 0 0; padding:0; }
  li { position:relative; display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:6px 0; min-height:32px; }
  li + li { border-top:1px solid var(--line); }
  li .p { flex:1; min-width:0; overflow-wrap:anywhere; }
  li .p.one { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; overflow-wrap:normal; }
  li small { display:block; font-size:12.5px; overflow-wrap:normal; }
  li small span + span { margin-left:10px; }
  li .v { white-space:nowrap; font-weight:500; font-variant-numeric:tabular-nums; }
  li.empty { color:var(--muted); }
  li.bar::after { content:""; position:absolute; left:0; bottom:-1px; height:2px; border-radius:2px; width:calc(var(--f) * 100%); background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 15%, transparent)); }
  .threat { color:var(--crit); font-weight:600; }
  .tag { padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:600; border:1px solid var(--edge); background:color-mix(in srgb, var(--warn) 20%, transparent); }
  .who { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left; text-decoration:underline dotted color-mix(in srgb, var(--muted) 70%, transparent); text-underline-offset:3px; }
  .who:hover { text-decoration-color:var(--accent); }
  .count { font-size:12.5px; color:var(--muted); margin-left:6px; }
  details > summary { cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::before { content:"▸"; display:inline-block; width:1em; color:var(--muted); transition:transform .15s; }
  details[open] > summary::before { transform:rotate(90deg); }
  ul.subs { margin:2px 0 4px 1em; } ul.subs li { min-height:26px; padding:3px 0; font-size:13px; }
  .expected { margin-top:6px; padding-top:6px; border-top:1px solid var(--line); font-size:13px; }
  .expected > summary { color:var(--muted); }

  /* D: device table and side column */
  .scroll { overflow-x:clip; } .links-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th { position:sticky; top:48px; z-index:1; padding:4px 8px; font-size:12px; font-weight:650; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); text-align:left; white-space:nowrap; background:color-mix(in srgb, var(--bg) 80%, transparent); }
  td { padding:6px 8px; height:32px; border-top:1px solid var(--line); white-space:nowrap; }
  td:first-child, th:first-child { padding-left:0; }
  td.name { max-width:240px; overflow:hidden; text-overflow:ellipsis; }
  .netcard { padding:10px 12px; border-radius:12px; border:1px solid var(--edge); background:color-mix(in srgb, var(--surface) 45%, transparent); }
  .netcard h4 { margin:0; font-size:14px; }
  .netcard p { margin:2px 0 0; font-size:12.5px; color:var(--muted); }
  .networks { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:10px; margin-bottom:10px; }
  .gauge { height:6px; border-radius:3px; background:var(--line); margin:8px 0 4px; overflow:hidden; }
  .gauge i { display:block; height:100%; width:calc(var(--f) * 100%); background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 50%, #fff), var(--accent) 60%); }
  .gauge.full i { background:var(--warn); }
  .links td { height:28px; font-size:13px; }
  .fb { height:40px; margin-top:8px; }
  #footer { font-size:12.5px; color:var(--muted); }
  #footer p { margin:0; }

  /* Device card */
  dialog { width:min(560px, calc(100vw - 32px)); max-height:min(82vh, 760px); padding:0; border:1px solid var(--edge); border-radius:14px; color:var(--text);
    background:var(--sheen), color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(26px) saturate(170%); -webkit-backdrop-filter:blur(26px) saturate(170%);
    box-shadow:inset 0 1px 0 var(--hi), 0 30px 60px -20px rgba(0,0,0,.45); }
  dialog::backdrop { background:rgba(10,20,20,.3); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .card { padding:16px 18px 10px; }
  .card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .card-head h3 { margin:0; font-size:18px; font-weight:680; letter-spacing:-.02em; overflow-wrap:anywhere; }
  .card-head p { margin:2px 0 0; font-size:12.5px; color:var(--muted); }
  .close { font:inherit; font-size:22px; line-height:1; padding:2px 9px; border:0; border-radius:8px; background:none; color:var(--muted); cursor:pointer; }
  .close:hover { color:var(--text); background:var(--line); }
  .figures { display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:10px; }
  .figures b { display:block; font-size:20px; font-weight:620; letter-spacing:-.03em; line-height:1.1; }
  .figures span { font-size:12.5px; color:var(--muted); }

  @media (min-width:1100px) {
    dialog { position:fixed; z-index:5; inset:0 0 0 auto; margin:0; width:440px; height:100dvh; max-height:100dvh; border-radius:14px 0 0 14px; overflow:auto; }
    body.side-panel .page { padding-right:456px; }
  }

  body.stale .page { filter:grayscale(1); opacity:.5; transition:opacity .3s, filter .3s; }

  /* Phone: the table becomes a two-line list */
  @media (max-width:699px) {
    .m { display:none; }
    thead { display:none; }
    tbody tr { display:grid; grid-template-columns:1fr auto auto; column-gap:12px; border-top:1px solid var(--line); padding:4px 0; }
    td { border:0; height:auto; padding:1px 0; }
    td.name { max-width:none; grid-column:1 / 3; grid-row:1; } td.d { grid-column:3; grid-row:1; }
    td.ip { grid-column:1; grid-row:2; } td.nw { grid-column:2; grid-row:2; } td.seen { grid-column:3; grid-row:2; }
    td.q, td.b { display:none; }
    .beacon small, #sys { display:none; }
    dialog { width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; border-radius:0; }
  }
  @media (prefers-reduced-motion: reduce) { .halos i, .beacon i::after { animation:none; } details > summary::before { transition:none; } }
  @media (prefers-reduced-transparency: reduce) {
    header { background:var(--bg); backdrop-filter:none; -webkit-backdrop-filter:none; }
    .halos { display:none; }
    .pan, .tile, dialog { backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--surface); }
  }
  #lang { font:inherit; font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--muted); cursor:pointer; }
  h3 b, h4 b, .leg b { font-weight:inherit; }
</style></head>
<body>
<div class="halos" aria-hidden="true"><i></i><i></i><i></i></div>
<header>
  <h1>Vigie</h1>
  <input id="q" type="search" data-i18n-ph="search_ph" data-i18n-aria="search_aria" autocomplete="off">
  <p id="sys"></p>
  <button id="lang" type="button"></button>
  <div id="beacon" class="beacon" role="status"><i aria-hidden="true"></i><div><strong id="state"></strong><small id="updated"></small></div></div>
</header>

<main class="page"><div class="grid">
  <section class="tile rx m2" id="k-rx"><h2 data-i18n="k_rx"></h2><b>–</b><p></p><div class="mini"></div></section>
  <section class="tile tx m2" id="k-tx"><h2 data-i18n="k_tx"></h2><b>–</b><p></p><div class="mini"></div></section>
  <section class="tile m2" id="k-lat"><h2 data-i18n="k_lat"></h2><b>–</b><p></p><div class="mini"></div></section>
  <section class="tile" id="k-dev"><h2 data-i18n="k_dev"></h2><b>–</b><p></p></section>
  <section class="tile m2" id="k-dns"><h2 data-i18n="k_dns"></h2><b>–</b><p></p><div class="mini"></div></section>
  <section class="tile" id="k-blk"><h2 data-i18n="k_blk"></h2><b>–</b><p></p></section>

  <section class="pan traffic" id="traffic"><h3><b data-i18n="wan_traffic"></b> <span id="wan-link"></span></h3>
    <div class="bar"><div class="per" role="group" data-i18n-aria="period"><button data-p="5m">5 min</button><button data-p="1h">1 h</button><button data-p="24h">24 h</button><button data-p="30d" data-i18n="per_30d"></button></div>
      <span class="leg"><i></i><b data-i18n="k_rx"></b><i class="b"></i><b data-i18n="k_tx"></b></span></div>
    <div class="chart" id="chart" role="img">
      <svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/>
        </linearGradient></defs>
        <path id="gridlines"/><path id="area" fill="url(#fade)"/><g id="bars"></g><path id="line-rx"/><path id="line-tx"/>
      </svg>
      <div id="ys" aria-hidden="true"></div><div id="guide" hidden></div><div id="tip" hidden></div></div>
    <div class="xs" id="xs" aria-hidden="true"></div>
    <p id="totals"></p></section>
  <section class="pan alerts" id="alerts-p"><h3><b data-i18n="to_watch"></b> <span id="n-alerts"></span></h3><ul id="alerts"></ul><div class="health" id="health"></div></section>
  <section class="pan" id="s-threats" hidden><h3><b data-i18n="threats_blocked"></b> <span>24 h</span></h3><ul id="threats"></ul></section>

const LOC = {en: "en-GB", fr: "fr-FR"};

const t = (k, ...a) => (D[lang][k] ?? D.en[k] ?? k).replace(/\{(\d)\}/g, (_, i) => a[i]);
const tr = (p, v) => D[lang][p + v] ?? D.en[p + v] ?? v; // server-provided labels (service states, probe names...)
const plw = (n, k) => t("w_" + k).split("|")[(lang === "fr" ? n > 1 : n !== 1) ? 1 : 0];

const $ = id => document.getElementById(id);
const fmt = (n, d=0) => n.toLocaleString(LOC[lang], {minimumFractionDigits:d, maximumFractionDigits:d});
const nb = n => n == null ? "–" : fmt(n);
const pl = (n, k) => `${fmt(n)} ${plw(n, k)}`;
const bytes = n => n == null ? "–" : n < 1024 ? fmt(n)+" "+t("u_B") : n < 1048576 ? fmt(n/1024,1)+" "+t("u_K") : n < 1073741824 ? fmt(n/1048576,1)+" "+t("u_M") : fmt(n/1073741824,2)+" "+t("u_G");
const bps = n => n == null ? ["–", ""] : n*8 < 1e6 ? [fmt(n*8/1e3), "kb/s"] : [fmt(n*8/1e6,1), "Mb/s"];
const rate = n => bps(n).join(" ");
const timeStr = ts => new Date(ts*1000).toLocaleTimeString(LOC[lang]);
const dateStr = ts => ts ? new Date(ts*1000).toLocaleDateString(LOC[lang], {day:"numeric", month:"short"}) : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dom = d => esc(d).replaceAll(".", ".<wbr>");
const nm = n => n === "router" ? t("name_router") : n;
const who = x => x.ip ? `<button type="button" class="who" data-ip="${esc(x.ip)}">${esc(nm(x.name) || x.ip)}</button>` : esc(nm(x.name) || "");
const domBtn = d => `<button type="button" class="who" data-d="${esc(d)}">${dom(d)}</button>`;
const ipn = ip => ip ? ip.split(".").reduce((a, c) => a * 256 + +c, 0) : 0;
// UI preferences, kept in the browser (never blocking); the search box is not saved
const ui = {per: "5m", sort: {k: "state", d: 1}, filt: [], lim: {}, open: {}, tab: "new", all: false, q: ""};
try { Object.assign(ui, JSON.parse(localStorage.getItem("vigie") || "{}"), {q: ""}); } catch (err) {}
if (!PER_OK(ui.per)) ui.per = "5m";
function PER_OK(p) { return ["5m", "1h", "24h", "30d"].includes(p); }
const save = () => { try { localStorage.setItem("vigie", JSON.stringify({...ui, q: undefined})); } catch (err) {} };
let S = null, deviceRows = [], opened = null, cardRefresh = null; // last status received, table rows, device card focus
let head = () => t("connecting"), upd = () => "";
const paintHead = () => { $("state").textContent = head(); $("updated").textContent = upd(); };

// Rewrites a zone only if it changed, giving focus back to the button that had it
const KEYS = ["f", "plus", "o", "ip", "tt"];
function put(id, h) {
  const el = $(id);
  if (el._h === h) return;
  const a = document.activeElement, key = el.contains(a) && KEYS.find(k => a.dataset[k] != null);
  el._h = h; el.innerHTML = h;
  if (key) el.querySelector(`[data-${key}="${a.dataset[key]}"]`)?.focus();
}
const search = () => ui.q.trim().toLowerCase();
// r = {a: main text, sub: secondary line, v: right-hand value, f: share 0..1 for the bar, t: plain text (search, tooltip)}
// On the page: filtered by the search, 8 rows then "Show n more"; raw = no filter nor limit (card)
function list(id, rows, empty = t("nothing"), raw) {
  const f = raw ? "" : search(), all = f ? rows.filter(r => (r.t || "").toLowerCase().includes(f)) : rows;
  const open = raw || ui.lim[id], shown = open ? all : all.slice(0, 8), rest = all.length - shown.length;
  put(id, all.length ? shown.map(r => `<li${r.f != null ? ` class="bar" style="--f:${r.f.toFixed(3)}"` : ""}><div class="p one" title="${esc(r.t)}">${r.a}${r.sub ? `<small>${r.sub}</small>` : ""}</div><span class="v">${r.v ?? ""}</span></li>`).join("")
    + (raw ? "" : rest > 0 ? `<li class="plus"><button data-plus="${id}">${t("show_more", fmt(rest))}</button></li>` : open && all.length > 8 ? `<li class="plus"><button data-plus="${id}">${t("collapse")}</button></li>` : "")
    : `<li class="empty">${f ? t("no_results") : empty}</li>`);
}
const share = (xs, key) => { const m = Math.max(1, ...xs.map(key)); return x => key(x) / m; };
document.addEventListener("toggle", ev => { const g = ev.target.dataset?.g; if (g) { ev.target.open ? ui.open[g] = 1 : delete ui.open[g]; save(); } }, true);
function groups(id, gs, empty, raw) {
  const f = share(gs, g => g.n);
  list(id, gs.map(g => {
    const key = id + ":" + g.domain, rest = g.sub_count - g.subs.length;
    const a = g.sub_count === 1 ? domBtn(g.subs[0][0])
      : `<details data-g="${esc(key)}"${ui.open[key] ? " open" : ""}><summary>${domBtn(g.domain)}<span class="count">${pl(g.sub_count, "subdomain")}</span></summary>`
        + `<ul class="subs">${g.subs.map(([d, n]) => `<li><div class="p">${domBtn(d)}</div><span class="v">${fmt(n)}</span></li>`).join("")}`
        + `${rest > 0 ? `<li class="empty">+ ${pl(rest, "other")}</li>` : ""}</ul></details>`;
    return {a, v: pl(g.n, "query"), f: f(g), t: g.domain + " " + g.subs.map(x => x[0]).join(" ")};
  }), empty, raw);
}
const cardHead = (title, l1, l2) => { $("c-t1").textContent = t(l1); $("c-t2").textContent = t(l2); $("c-name").textContent = title; };
async function deviceCard(ip) {
  cardRefresh = () => deviceCard(ip);
  try {
    const f = await (await fetch("api/device?ip=" + encodeURIComponent(ip))).json(), x = deviceRows.find(l => l.ip === ip) || {};
    cardHead(nm(f.name) || nm(x.name) || ip, "domains_req", "blocked_for_device");
    $("c-ip").textContent = [ip, x.mac, x.network, x.fixed ? t("tag_static") : x.lease ? t("lease") : ""].filter(Boolean).join(" · ");
    $("c-seen").textContent = x.first_seen || x.last_seen ? t("first_seen", dateStr(x.first_seen), x.online ? t("online") : t("last_seen", dateStr(x.last_seen))) : "";
    $("c-figures").innerHTML = [[f.queries_24h, "query"], [f.ads, "ad_blocked"], [f.threats, "threat"], [f.expected.n, "expected"]]
      .map(([n, k]) => `<div><b>${fmt(n)}</b><span>${plw(n, k)}</span></div>`).join("");
    mini("c-hours", f.per_hour, 1);
    groups("c-domains", f.groups, t("no_queries"), 1);
    list("c-blocked", f.blocked.map(x => ({a: x.list === "threats" ? `<span class="threat">${dom(x.domain)}</span>` : dom(x.domain), t: x.domain,
      sub: x.list === "threats" ? t("mal_label") : t("ad_label"), v: pl(x.n, "times")})), t("nothing_blocked"), 1);
    openCard(ip);
  } catch (err) { /* vigie unreachable: the header already says so */ }
}
function openCard(ip) {
  const d = $("card");
  if (d.open) return;
  opened = [document.activeElement, ip];
  if (matchMedia("(min-width:1100px)").matches) { d.show(); document.body.classList.add("side-panel"); } else d.showModal();
}
// Domain card: who asks for it, its subdomains, queries per hour
async function domainCard(dm) {
  cardRefresh = () => domainCard(dm);
  try {
    const f = await (await fetch("api/domain?d=" + encodeURIComponent(dm))).json();
    cardHead(f.domain, "subs_req", "who_asks_it");
    $("c-ip").textContent = t("domain_and_subs");
    $("c-seen").textContent = f.first_seen ? t("first_seen_on", dateStr(f.first_seen)) : "";
    $("c-figures").innerHTML = `<div><b>${fmt(f.queries_24h)}</b><span>${plw(f.queries_24h, "query")}</span></div><div><b>${fmt(f.clients.length)}</b><span>${plw(f.clients.length, "device")}</span></div>`;
    mini("c-hours", f.per_hour, 1);
    list("c-domains", f.subs.map(([x, n]) => ({a: dom(x), t: x, v: fmt(n)})), t("no_queries"), 1);
    list("c-blocked", f.clients.map(x => ({a: who(x), t: x.ip, v: pl(x.n, "query")})), t("nobody"), 1);
    openCard("");
  } catch (err) { /* same */ }
}
$("card").addEventListener("close", () => { document.body.classList.remove("side-panel"); (opened[0].isConnected ? opened[0] : document.querySelector(`.who[data-ip="${opened[1]}"]`))?.focus(); });
const motion = () => matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
document.addEventListener("click", ev => {
  const e = ev.target, bt = e.closest("button"), al = e.closest(".alert a");
  if (bt?.dataset.d) { ev.preventDefault(); domainCard(bt.dataset.d); }
  else if (bt?.classList.contains("who")) deviceCard(bt.dataset.ip);
  else if (e === $("card")) $("card").close();
  else if (bt?.dataset.plus) { ui.lim[bt.dataset.plus] = !ui.lim[bt.dataset.plus]; save(); render(); }
  else if (bt?.dataset.f) { const k = bt.dataset.f; ui.filt = ui.filt.includes(k) ? ui.filt.filter(x => x !== k) : [...ui.filt, k]; save(); render(); }
  else if (bt?.dataset.o) { ui.tab = bt.dataset.o; save(); render(); }
  else if (bt?.id === "more-all") { ui.all = !ui.all; save(); render(); }
  else if (bt && bt.parentElement.dataset.k) { const k = bt.parentElement.dataset.k; ui.sort = ui.sort.k === k ? {k, d: -ui.sort.d} : {k, d: ["name", "ip", "mac", "network"].includes(k) ? 1 : -1}; save(); render(); }
  else if (al) {
    ev.preventDefault();
    if (al.dataset.flt) { ui.filt = [al.dataset.flt]; save(); render(); }
    $(al.dataset.target).scrollIntoView({behavior: motion(), block: "start"});
  }
});
$("q").addEventListener("input", () => { ui.q = $("q").value; render(); });
addEventListener("keydown", ev => {
  if (ev.key === "/" && !ev.ctrlKey && !ev.metaKey && !ev.target.closest?.("input,textarea,select")) { ev.preventDefault(); $("q").focus(); }

let last = null, latT = 0;
async function refresh() {
  try {
    const e = await (await fetch("api/status")).json(), w = e.interfaces[e.wan] || {}, net = e.health.latencies.find(x => x.name === "Internet");
    h1.rx.push(w.rx || 0); h1.tx.push(w.tx || 0); h1.end = e.now;
    if (h1.rx.length > 720) { h1.rx.shift(); h1.tx.shift(); }
    if (net && e.now - latT >= 30) { lat.push(net.ms); latT = e.now; if (lat.length > 120) lat.shift(); }
    S = e; render(); draw();
    const l = longs[ui.per];
    if (PER[ui.per].step > 5 && (!l || Date.now() - l.t > 3e5)) loadLong(ui.per);
    last = e.now;
    document.body.classList.remove("stale");
    upd = () => t("updated", timeStr(last)); paintHead();
  } catch (err) {
    document.body.classList.add("stale");
    $("beacon").className = "beacon";
    head = () => t("unreachable");
    upd = () => last ? t("stale", timeStr(last)) : ""; paintHead();
  }
}

  paintHead();
}
$("lang").addEventListener("click", () => {
  lang = lang === "fr" ? "en" : "fr";
  try { localStorage.setItem("vigie.lang", lang); } catch (err) {}
  applyLang(); render(); draw();
  if ($("card").open && cardRefresh) cardRefresh();
});
applyLang();
// Hidden tab: no requests; on return the history is re-read and the rhythm resumes
let running = false;
function start() {
  running = true;
  load1h().then(() => { refresh(); setInterval(() => document.hidden || refresh(), 5000); });
}
document.addEventListener("visibilitychange", () => { if (document.hidden) return; if (running) load1h().then(refresh); else start(); });
if (!document.hidden) start();
</script>
</body>
